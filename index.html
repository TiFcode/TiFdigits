<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#137a46">
  <title>TiFdigits — Cifre RO / EN</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap');

    :root { --ink:#15342a; --green:#0d9b57; --deep:#075e39; --cream:#fffbed; --red:#ce233c; --blue:#124b9a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; min-height:100dvh; color:var(--ink); font-family:Fredoka, ui-rounded, system-ui, sans-serif; background:radial-gradient(circle at 18% 8%, #fff 0 12%, transparent 30%), linear-gradient(145deg, #e5f8f0, #fffbdf 58%, #ddecff); user-select:none; -webkit-user-select:none; }
    main { width:min(980px, 100%); min-height:100vh; min-height:100dvh; margin:auto; padding:clamp(22px, 5vw, 48px) clamp(16px, 4vw, 44px) max(24px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; }
    header { text-align:center; margin-bottom:clamp(18px, 4vh, 38px); }
    h1 { margin:0; font-size:clamp(29px, 5vw, 48px); letter-spacing:.01em; color:var(--deep); }
    header p { margin:7px 0 0; color:#487064; font-size:clamp(15px, 2.6vw, 20px); }
    .choices { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:clamp(14px, 3.5vw, 34px); align-items:stretch; flex:1; }
    .card { appearance:none; width:100%; min-height:clamp(330px, 58vh, 500px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(15px, 3vw, 26px); padding:24px 14px; border:5px solid; border-radius:34px; cursor:pointer; font:inherit; color:inherit; background:rgba(255,255,255,.78); box-shadow:0 12px 0 rgba(23,73,53,.13), 0 18px 30px rgba(20,74,52,.13); transition:transform .14s ease, box-shadow .14s ease, background .14s ease; -webkit-tap-highlight-color:transparent; }
    .card:hover { transform:translateY(-4px); box-shadow:0 16px 0 rgba(23,73,53,.13), 0 23px 35px rgba(20,74,52,.17); }
    .card:focus-visible { outline:5px solid #ffbd28; outline-offset:4px; }
    .card:active, .card.speaking { transform:translateY(8px) scale(.985); box-shadow:0 4px 0 rgba(23,73,53,.12), 0 8px 16px rgba(20,74,52,.15); }
    .romanian { border-color:var(--blue); }
    .english { border-color:var(--red); }
    .language { font-size:clamp(18px, 3vw, 25px); font-weight:700; letter-spacing:.04em; }
    .romanian .language { color:var(--blue); }
    .english .language { color:var(--red); }
    .digit { font-size:clamp(130px, 24vw, 245px); font-weight:700; line-height:.72; text-shadow:0 7px 0 rgba(16,56,42,.09); }
    .flag { width:min(80%, 270px); aspect-ratio:3/2; overflow:hidden; display:flex; border-radius:12px; border:3px solid rgba(21,52,42,.15); box-shadow:0 6px 12px rgba(10,50,36,.16); }
    .flag span { flex:1; }
    .ro .blue { background:#002b7f; } .ro .yellow { background:#fcd116; } .ro .red { background:#ce1126; }
    .us { background:repeating-linear-gradient(to bottom, #b22234 0 7.69%, #fff 7.69% 15.38%); position:relative; }
    .us::before { content:'★ ★ ★\A ★ ★ ★\A ★ ★ ★'; white-space:pre; position:absolute; top:0; left:0; width:43%; height:54%; display:grid; place-content:center; color:#fff; background:#3c3b6e; font-size:clamp(10px, 2.4vw, 19px); line-height:1.15; letter-spacing:1px; }
    .hint { margin:clamp(16px, 4vh, 34px) 0 13px; min-height:24px; text-align:center; color:#426c5e; font-size:clamp(15px, 2.6vw, 19px); font-weight:600; }
    .next { align-self:center; width:min(100%, 530px); padding:18px 24px; border:0; border-radius:24px; color:white; background:linear-gradient(180deg, #20bd70, #07934e); box-shadow:0 8px 0 #056d38, 0 12px 20px rgba(3,101,55,.24); cursor:pointer; font:700 clamp(22px, 4vw, 31px)/1 Fredoka, sans-serif; letter-spacing:.025em; transition:transform .14s, box-shadow .14s; -webkit-tap-highlight-color:transparent; }
    .next:focus-visible { outline:5px solid #ffbd28; outline-offset:4px; }
    .next:active { transform:translateY(6px); box-shadow:0 2px 0 #056d38, 0 5px 10px rgba(3,101,55,.25); }
    @media (max-width:560px) { main { padding-top:20px; } .choices { gap:12px; } .card { min-height:300px; border-width:4px; border-radius:25px; padding:18px 7px; } .flag { width:86%; border-radius:8px; } .next { border-radius:19px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>TiFdigits</h1>
      <p>Apasă pe o cifră ca să o auzi / Tap a digit to hear it</p>
    </header>

    <section class="choices" aria-label="Alege limba pentru pronunție">
      <button class="card romanian" id="roCard" type="button" aria-label="Ascultă cifra în română">
        <span class="language">ROMÂNĂ</span>
        <span class="digit" aria-hidden="true">0</span>
        <span class="flag ro" aria-label="Drapelul României"><span class="blue"></span><span class="yellow"></span><span class="red"></span></span>
      </button>
      <button class="card english" id="enCard" type="button" aria-label="Hear the digit in English">
        <span class="language">ENGLISH</span>
        <span class="digit" aria-hidden="true">0</span>
        <span class="flag us" aria-label="United States flag"></span>
      </button>
    </section>

    <p class="hint" id="hint" aria-live="polite">Alege limba și ascultă cifra!</p>
    <button class="next" id="next" type="button">URMĂTORUL / NEXT</button>
  </main>

  <script>
    (() => {
      const names = {
        ro: ['zero', 'unu', 'doi', 'trei', 'patru', 'cinci', 'șase', 'șapte', 'opt', 'nouă'],
        en: ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine']
      };
      const cards = { ro: document.querySelector('#roCard'), en: document.querySelector('#enCard') };
      const digits = document.querySelectorAll('.digit');
      const hint = document.querySelector('#hint');
      let number = Math.floor(Math.random() * 10);

      function setNumber(nextNumber) {
        number = nextNumber;
        digits.forEach(digit => { digit.textContent = number; });
        hint.textContent = 'Alege limba și ascultă cifra!';
      }
      function speak(language) {
        const label = names[language][number];
        window.speechSynthesis?.cancel();
        const utterance = new SpeechSynthesisUtterance(label);
        utterance.lang = language === 'ro' ? 'ro-RO' : 'en-US';
        utterance.rate = .82;
        utterance.pitch = 1.08;
        const card = cards[language];
        card.classList.add('speaking');
        utterance.onend = utterance.onerror = () => card.classList.remove('speaking');
        window.speechSynthesis?.speak(utterance);
        hint.textContent = language === 'ro' ? `Ai auzit: ${label}` : `You heard: ${label}`;
      }
      cards.ro.addEventListener('click', () => speak('ro'));
      cards.en.addEventListener('click', () => speak('en'));
      document.querySelector('#next').addEventListener('click', () => {
        let next;
        do { next = Math.floor(Math.random() * 10); } while (next === number);
        window.speechSynthesis?.cancel();
        Object.values(cards).forEach(card => card.classList.remove('speaking'));
        setNumber(next);
      });
      setNumber(number);
    })();
  </script>
</body>
</html>
